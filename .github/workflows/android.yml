name: Build CINESPHERE BOOST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make gradlew executable
      run: chmod +x CINESPHERE_BOOST/gradlew

    - name: Build APK with Gradle
      run: cd CINESPHERE_BOOST && ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: CINESPHERE_BOOST/app/build/outputs/apk/debug/app-debug.apk

