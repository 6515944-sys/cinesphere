
name: Build CINESPHERE BOOST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q CINESPHERE_BOOST_Android_Source.zip

      - name: Build APK
        working-directory: CINESPHERE_BOOST
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CINESPHERE-BOOST-APK
          path: CINESPHERE_BOOST/app/build/outputs/apk/debug/app-debug.apk
